{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="container">
  <div class="row d-flex justify-content-center align-items-center login-container">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 p-md-5">
          <h2 class="text-center mb-4">Регистрация</h2>
          <form method="POST" action="{{ url_for('main.register') }}">
              
              <div class="mb-3">
                  <label for="full_name" class="form-label">Ф.И.О.</label>
                  <input type="text" class="form-control" id="full_name" name="full_name" required>
              </div>

              {# --- ЖАҢА ӨРІС: ГРУППА --- #}
              <div class="mb-3">
                  <label for="group_number" class="form-label">Ваша группа (Например: ИС-21-9)</label>
                  <input type="text" class="form-control" id="group_number" name="group_number" placeholder="Только для студентов">
              </div>

              <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" name="email" required>
              </div>
              <div class="mb-3">
                  <label for="password" class="form-label">Пароль</label>
                  <input type="password" class="form-control" id="password" name="password" required>
              </div>
              <button type="submit" class="btn btn-primary w-100 btn-lg mt-3">Зарегистрироваться</button>
          </form>
          <p class="text-center mt-4">
            Уже есть аккаунт? <a href="{{ url_for('main.login') }}">Войти</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
